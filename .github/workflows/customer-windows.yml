name: Build customer Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/customer/**'
      - '.github/workflows/customer-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: native/customer
      - run: npx electron-builder --win portable --publish never
        working-directory: native/customer
      - uses: actions/upload-artifact@v4
        with:
          name: Customer-Windows
          path: native/customer/dist/TUTY-AQUEStore-Customer.exe
