name: Build customer Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/customer-android/**'
      - '.github/workflows/customer-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
        working-directory: native/customer-android
      - run: cp native/customer-android/app/build/outputs/apk/debug/app-debug.apk TUTY-AQUEStore-Customer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Customer-Android
          path: TUTY-AQUEStore-Customer.apk
