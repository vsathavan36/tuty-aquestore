<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store admin</title><style>body{font:16px system-ui;max-width:780px;margin:auto;padding:16px}input,textarea,select{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:12px;margin:8px;background:#075985;color:white;border:0;border-radius:8px}</style><h1>TUTY AQUEStore Admin</h1><a href="index.html">Store</a><p>Edit catalogue, download products.json and upload it to GitHub. GitHub handles authentication.</p><select id="pick"></select><button id="new">New product</button><form id="form"><label>Name<input id="name" required></label><label>Category<input id="category" required></label><label>Price<input id="price" type="number" min="0" step=".01" required></label><label>Stock<input id="stock" type="number" min="0" required></label><label>Description<textarea id="description"></textarea></label><label>Image URL<input id="image"></label><label>Photo<input id="photo" type="file" accept="image/*"></label><button>Save draft</button><button type="button" id="delete">Delete</button></form><label>Demo catalogue<input type="checkbox" id="demo" checked></label><button id="download">Download products.json</button><a href="https://github.com/vsathavan36/tuty-aquestore/upload/main">Publish on GitHub</a><p id="status"></p><script>const $=id=>document.getElementById(id);let data={demo:true,products:[]},id=null;const fields=['name','category','price','stock','description','image'];function refresh(){ $('pick').replaceChildren(new Option('New product',''),...data.products.map(p=>new Option(p.name,p.id)));$('pick').value=id||'';let p=data.products.find(p=>p.id===id);for(let k of fields)$(k).value=p?.[k]??'';$('photo').value=''}$('pick').onchange=()=>{id=$('pick').value||null;refresh()};$('new').onclick=()=>{id=null;refresh()};$('form').onsubmit=async e=>{e.preventDefault();let p={id:id||crypto.randomUUID(),emoji:'🐠'};for(let k of fields)p[k]=['price','stock'].includes(k)?Number($(k).value):$(k).value;let f=$('photo').files[0];if(f){if(f.size>2000000){$('status').textContent='Photo must be under 2 MB';return}p.image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}data.products=data.products.filter(x=>x.id!==p.id).concat(p);id=p.id;refresh();$('status').textContent='Draft saved'};$('delete').onclick=()=>{if(id&&confirm('Delete product?')){data.products=data.products.filter(p=>p.id!==id);id=null;refresh()}};$('download').onclick=()=>{data.demo=$('demo').checked;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='products.json';a.click()};fetch('products.json').then(r=>r.json()).then(d=>{data=d;$('demo').checked=d.demo;refresh()}).catch(()=>{$('status').textContent='Catalogue could not load; do not overwrite it.'});</script></html>
